<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro Campaign Manager</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2433; --muted: #6b7385; --line: #dde1e8;
    --accent: #2563eb; --accent-text: #fff; --danger: #c62828; --ok: #1b7f3b; --hover: #eef2ff; --added: #e8f6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1d222b; --text: #e6e9ef; --muted: #98a1b3; --line: #2e3542;
      --accent: #5b8def; --accent-text: #0b1020; --danger: #ef6b6b; --ok: #4cc27a; --hover: #232a38; --added: #1f3326;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  nav button { background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer;
               font: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
          background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
           background: var(--bg); color: var(--text); font: inherit; }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 7px;
         padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { margin: 0; padding: 6px 12px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-weight: 500; }
  .picker { position: relative; }
  .picker ul { position: absolute; z-index: 5; left: 0; right: 0; margin: 2px 0 0; padding: 4px;
               list-style: none; background: var(--panel); border: 1px solid var(--line);
               border-radius: 8px; max-height: 240px; overflow: auto; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .picker li { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
  .picker li:hover { background: var(--hover); }
  .picker li.empty { color: var(--muted); cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 7px; border: 1px solid var(--line); }
  .msg.ok { color: var(--ok); border-color: var(--ok); }
  .msg.err { color: var(--danger); border-color: var(--danger); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > .picker { flex: 1; }
  .row .btn { margin: 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .spinner { color: var(--muted); }
  tr.added td { background: var(--added); }
  tr.removed td { opacity: .5; }
  tr.removed td.name { text-decoration: line-through; }
  .banner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px;
            padding: 10px 12px; border-radius: 7px; background: var(--added); }
  .banner span { flex: 1; min-width: 160px; }
  .btn.plain { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .toolbar { display: flex; justify-content: flex-end; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Keitaro Campaign Manager</h1>
  <nav role="tablist">
    <button role="tab" id="tab-create" aria-selected="true">Create campaign</button>
    <button role="tab" id="tab-edit" aria-selected="false">Edit offers</button>
  </nav>

  <section id="view-create" class="card">
    <form id="create-form" autocomplete="off">
      <label for="c-name">Name</label>
      <input id="c-name" required placeholder="au_mx_flexacil">
      <label for="c-geo">Geo (comma-separated country codes)</label>
      <input id="c-geo" required placeholder="MX,AU,RO">
      <label for="c-offer">Offer (search by name or ID)</label>
      <div class="picker" id="c-picker"></div>
      <button class="btn" type="submit" id="c-submit">Create</button>
    </form>
    <div id="c-msg" role="status"></div>
  </section>

  <section id="view-edit" class="card" hidden>
    <label for="e-campaign">Campaign</label>
    <select id="e-campaign"></select>
    <div id="e-body"></div>
    <div id="e-msg" role="status"></div>
  </section>
</main>

<script>
"use strict";
const API = {
  campaigns: "/campaigns",
  offers: "/offers",
  campaignOffers: (id) => `/campaigns/${id}/offers`,
  campaignOffer: (id, offerId) => `/campaigns/${id}/offers/${offerId}`,
};
const SEARCH_DELAY_MS = 250;
const MIN_QUERY_LENGTH = 1;
const FULL_SHARE = 100;
const STATE = { KEPT: "kept", ADDED: "added", REMOVED: "removed" };

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function request(url, options = {}) {
  const response = await fetch(url, {
    headers: options.body ? { "Content-Type": "application/json" } : {},
    ...options,
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) {
    const detail = data && data.detail;
    throw new Error(
      typeof detail === "string" ? detail : detail ? JSON.stringify(detail) : `HTTP ${response.status}`
    );
  }
  return data;
}

function showMessage(container, kind, text) {
  container.replaceChildren(el("div", { className: `msg ${kind}` }, text));
}

/* Offer picker: a text input with a dropdown filled from GET /offers?query=. */
function createPicker(container, inputId) {
  const input = el("input", { id: inputId, placeholder: "Start typing…", required: true });
  const list = el("ul", { hidden: true });
  container.append(input, list);
  let chosen = null;
  let timer = null;
  let ticket = 0;

  function close() { list.hidden = true; list.replaceChildren(); }

  function choose(offer) {
    chosen = offer;
    input.value = `[${offer.id}] ${offer.name}`;
    close();
  }

  async function search() {
    const query = input.value.trim();
    if (query.length < MIN_QUERY_LENGTH) { close(); return; }
    const mine = ++ticket;
    try {
      const offers = await request(`${API.offers}?query=${encodeURIComponent(query)}`);
      if (mine !== ticket) return;
      list.replaceChildren(...(offers.length
        ? offers.map((offer) => {
            const item = el("li", {}, `[${offer.id}] ${offer.name}`);
            item.addEventListener("mousedown", (event) => { event.preventDefault(); choose(offer); });
            return item;
          })
        : [el("li", { className: "empty" }, "Nothing found")]));
      list.hidden = false;
    } catch (error) {
      if (mine !== ticket) return;
      list.replaceChildren(el("li", { className: "empty" }, error.message));
      list.hidden = false;
    }
  }

  input.addEventListener("input", () => {
    chosen = null;
    clearTimeout(timer);
    timer = setTimeout(search, SEARCH_DELAY_MS);
  });
  input.addEventListener("blur", close);

  return {
    /* The chosen offer {id, name}, or an offer typed as a bare number {id, name: null}. */
    value() {
      if (chosen) return chosen;
      const typed = input.value.trim();
      return /^\d+$/.test(typed) ? { id: Number(typed), name: null } : null;
    },
    reset() { chosen = null; input.value = ""; close(); },
  };
}

/* ---- Tabs ---- */
function selectTab(name) {
  for (const key of ["create", "edit"]) {
    $(`tab-${key}`).setAttribute("aria-selected", String(key === name));
    $(`view-${key}`).hidden = key !== name;
  }
  if (name === "edit") loadCampaigns();
}
$("tab-create").addEventListener("click", () => selectTab("create"));
$("tab-edit").addEventListener("click", () => selectTab("edit"));

/* ---- Create ---- */
const createPicked = createPicker($("c-picker"), "c-offer");

$("create-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = $("c-msg");
  const picked = createPicked.value();
  const offerId = picked ? picked.id : null;
  if (offerId === null) { showMessage(message, "err", "Pick an offer from the list or type its numeric ID."); return; }
  const button = $("c-submit");
  button.disabled = true;
  message.replaceChildren(el("div", { className: "msg spinner" }, "Creating…"));
  try {
    const created = await request(API.campaigns, {
      method: "POST",
      body: JSON.stringify({ name: $("c-name").value, geo: $("c-geo").value, offer_id: offerId }),
    });
    showMessage(message, "ok", `Created: ${created.name} (Keitaro ID ${created.keitaro_id ?? "—"}, status ${created.status}).`);
    $("c-name").value = ""; $("c-geo").value = ""; createPicked.reset();
  } catch (error) {
    showMessage(message, "err", error.message);
  } finally {
    button.disabled = false;
  }
});

/* ---- Edit: changes are collected in a local draft and pushed to Keitaro at once ---- */
const draft = { campaignId: null, server: null, rows: [], picker: null };

const rowsFromServer = (offers) =>
  offers.map((offer) => ({ offer_id: offer.offer_id, name: offer.name, state: STATE.KEPT }));
const activeRows = () => draft.rows.filter((row) => row.state !== STATE.REMOVED);
const isDirty = () => draft.rows.some((row) => row.state !== STATE.KEPT);

/* Same rule as the server: even split, the remainder goes to the first offers. */
function evenShares(ids) {
  const shares = new Map();
  const base = Math.floor(FULL_SHARE / ids.length);
  const remainder = FULL_SHARE % ids.length;
  ids.forEach((id, index) => shares.set(id, base + (index < remainder ? 1 : 0)));
  return shares;
}

/* A clean draft shows the real shares from Keitaro; a changed one shows the recalculated split. */
function displayShares() {
  if (!isDirty()) return new Map(draft.server.offers.map((offer) => [offer.offer_id, offer.share]));
  return evenShares(activeRows().map((row) => row.offer_id));
}

function clearMessage() { $("e-msg").replaceChildren(); }

function confirmDiscard() {
  return !isDirty() || window.confirm("Discard unsaved changes?");
}

async function loadCampaigns() {
  const select = $("e-campaign");
  try {
    const campaigns = (await request(API.campaigns)).filter((item) => item.status === "active");
    select.replaceChildren(...campaigns.map((item) =>
      el("option", { value: item.id }, `${item.name} — ${item.geo.join(", ")}`)));
    if (!campaigns.length) {
      draft.campaignId = null; draft.rows = [];
      $("e-body").replaceChildren(el("div", { className: "meta" }, "No active campaigns yet. Create one first."));
      return;
    }
    await loadFromKeitaro();
  } catch (error) {
    showMessage($("e-msg"), "err", error.message);
  }
}

$("e-campaign").addEventListener("change", () => {
  if (!confirmDiscard()) { $("e-campaign").value = draft.campaignId; return; }
  loadFromKeitaro();
});

async function loadFromKeitaro(note) {
  const id = $("e-campaign").value;
  if (!id) return;
  try {
    const data = await request(API.campaignOffers(id));
    draft.campaignId = id; draft.server = data; draft.rows = rowsFromServer(data.offers);
    render();
    if (note) showMessage($("e-msg"), "ok", note); else clearMessage();
  } catch (error) {
    showMessage($("e-msg"), "err", error.message);
  }
}

function render() {
  const dirty = isDirty();
  const shares = displayShares();
  const total = activeRows().reduce((sum, row) => sum + (shares.get(row.offer_id) ?? 0), 0);

  const rows = draft.rows.map((row) => {
    const removed = row.state === STATE.REMOVED;
    const action = removed
      ? el("button", { className: "btn small plain", type: "button" }, "Bring back")
      : el("button", { className: "btn small danger", type: "button" }, "Remove");
    action.addEventListener("click", () => {
      clearMessage();
      if (removed) row.state = STATE.KEPT;
      else if (row.state === STATE.ADDED) draft.rows.splice(draft.rows.indexOf(row), 1);
      else row.state = STATE.REMOVED;
      render();
    });
    const share = removed ? 0 : shares.get(row.offer_id) ?? 0;
    return el("tr", { className: row.state },
      el("td", {}, String(row.offer_id)),
      el("td", { className: "name" }, removed ? `${row.name} (removed)` : row.name),
      el("td", { className: "num" }, `${share}%`),
      el("td", { className: "num" }, action));
  });

  const refresh = el("button", { className: "btn small plain", type: "button" }, "Fetch from Keitaro");
  refresh.addEventListener("click", () => { if (confirmDiscard()) loadFromKeitaro(); });

  const picker = el("div", { className: "picker" });
  draft.picker = createPicker(picker, "e-offer");
  const add = el("button", { className: "btn", type: "button" }, "Add offer");
  add.addEventListener("click", addOffer);

  const nodes = [
    el("div", { className: "toolbar" }, refresh),
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Offer ID"), el("th", {}, "Name"),
        el("th", { className: "num" }, "Share"), el("th", {}))),
      el("tbody", {}, ...rows),
      el("tfoot", {}, el("tr", {}, el("td", {}, "Total"), el("td", {}),
        el("td", { className: "num" }, `${total}%`), el("td", {})))),
    el("label", { htmlFor: "e-offer" }, "Add an offer (search by name or ID)"),
    el("div", { className: "row" }, picker, add),
    el("div", { className: "hint" }, "Traffic is split evenly between the offers."),
  ];

  if (dirty) {
    const push = el("button", { className: "btn small", type: "button" }, "Push to Keitaro");
    push.addEventListener("click", pushToKeitaro);
    const cancel = el("button", { className: "btn small plain", type: "button" }, "Cancel");
    cancel.addEventListener("click", () => { draft.rows = rowsFromServer(draft.server.offers); clearMessage(); render(); });
    nodes.push(el("div", { className: "banner" }, el("span", {}, "Unsaved changes: not in Keitaro yet."), push, cancel));
  }
  $("e-body").replaceChildren(...nodes);
}

async function addOffer() {
  clearMessage();
  const picked = draft.picker.value();
  if (!picked) { showMessage($("e-msg"), "err", "Pick an offer from the list or type its numeric ID."); return; }
  const existing = draft.rows.find((row) => row.offer_id === picked.id);
  if (existing) {
    if (existing.state === STATE.REMOVED) { existing.state = STATE.KEPT; render(); }
    else showMessage($("e-msg"), "err", `Offer ${picked.id} is already in this campaign.`);
    return;
  }
  let name = picked.name;
  if (name === null) {
    try {
      const found = (await request(`${API.offers}?query=${picked.id}`)).find((offer) => offer.id === picked.id);
      if (!found) { showMessage($("e-msg"), "err", `Offer ${picked.id} was not found in Keitaro.`); return; }
      name = found.name;
    } catch (error) {
      showMessage($("e-msg"), "err", error.message); return;
    }
  }
  draft.rows.push({ offer_id: picked.id, name, state: STATE.ADDED });
  render();
}

async function pushToKeitaro() {
  clearMessage();
  $("e-body").querySelectorAll("button").forEach((button) => { button.disabled = true; });
  try {
    const data = await request(API.campaignOffers(draft.campaignId), {
      method: "PUT",
      body: JSON.stringify({ offer_ids: activeRows().map((row) => row.offer_id) }),
    });
    draft.server = data; draft.rows = rowsFromServer(data.offers);
    render();
    showMessage($("e-msg"), "ok", "Pushed to Keitaro.");
  } catch (error) {
    render();  /* keep the draft so nothing is lost */
    showMessage($("e-msg"), "err", error.message);
  }
}
</script>
</body>
</html>
