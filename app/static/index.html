<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro Campaign Manager</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2433; --muted: #6b7385; --line: #dde1e8;
    --accent: #2563eb; --accent-text: #fff; --danger: #c62828; --ok: #1b7f3b; --hover: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1d222b; --text: #e6e9ef; --muted: #98a1b3; --line: #2e3542;
      --accent: #5b8def; --accent-text: #0b1020; --danger: #ef6b6b; --ok: #4cc27a; --hover: #232a38;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  nav button { background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer;
               font: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  section[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
          background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
           background: var(--bg); color: var(--text); font: inherit; }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 7px;
         padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { margin: 0; padding: 6px 12px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-weight: 500; }
  .picker { position: relative; }
  .picker ul { position: absolute; z-index: 5; left: 0; right: 0; margin: 2px 0 0; padding: 4px;
               list-style: none; background: var(--panel); border: 1px solid var(--line);
               border-radius: 8px; max-height: 240px; overflow: auto; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .picker li { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
  .picker li:hover { background: var(--hover); }
  .picker li.empty { color: var(--muted); cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 7px; border: 1px solid var(--line); }
  .msg.ok { color: var(--ok); border-color: var(--ok); }
  .msg.err { color: var(--danger); border-color: var(--danger); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > .picker { flex: 1; }
  .row .btn { margin: 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .spinner { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Keitaro Campaign Manager</h1>
  <nav role="tablist">
    <button role="tab" id="tab-create" aria-selected="true">Create campaign</button>
    <button role="tab" id="tab-edit" aria-selected="false">Edit offers</button>
  </nav>

  <section id="view-create" class="card">
    <form id="create-form" autocomplete="off">
      <label for="c-name">Name</label>
      <input id="c-name" required placeholder="au_mx_flexacil">
      <label for="c-geo">Geo (comma-separated country codes)</label>
      <input id="c-geo" required placeholder="MX,AU,RO">
      <label for="c-offer">Offer (search by name or ID)</label>
      <div class="picker" id="c-picker"></div>
      <button class="btn" type="submit" id="c-submit">Create</button>
    </form>
    <div id="c-msg" role="status"></div>
  </section>

  <section id="view-edit" class="card" hidden>
    <label for="e-campaign">Campaign</label>
    <select id="e-campaign"></select>
    <div id="e-body"></div>
  </section>
</main>

<script>
"use strict";
const API = {
  campaigns: "/campaigns",
  offers: "/offers",
  campaignOffers: (id) => `/campaigns/${id}/offers`,
  campaignOffer: (id, offerId) => `/campaigns/${id}/offers/${offerId}`,
};
const SEARCH_DELAY_MS = 250;
const MIN_QUERY_LENGTH = 1;

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function request(url, options = {}) {
  const response = await fetch(url, {
    headers: options.body ? { "Content-Type": "application/json" } : {},
    ...options,
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) {
    const detail = data && data.detail;
    throw new Error(
      typeof detail === "string" ? detail : detail ? JSON.stringify(detail) : `HTTP ${response.status}`
    );
  }
  return data;
}

function showMessage(container, kind, text) {
  container.replaceChildren(el("div", { className: `msg ${kind}` }, text));
}

/* Offer picker: a text input with a dropdown filled from GET /offers?query=. */
function createPicker(container, inputId) {
  const input = el("input", { id: inputId, placeholder: "Start typing…", required: true });
  const list = el("ul", { hidden: true });
  container.append(input, list);
  let chosen = null;
  let timer = null;
  let ticket = 0;

  function close() { list.hidden = true; list.replaceChildren(); }

  function choose(offer) {
    chosen = offer;
    input.value = `[${offer.id}] ${offer.name}`;
    close();
  }

  async function search() {
    const query = input.value.trim();
    if (query.length < MIN_QUERY_LENGTH) { close(); return; }
    const mine = ++ticket;
    try {
      const offers = await request(`${API.offers}?query=${encodeURIComponent(query)}`);
      if (mine !== ticket) return;
      list.replaceChildren(...(offers.length
        ? offers.map((offer) => {
            const item = el("li", {}, `[${offer.id}] ${offer.name}`);
            item.addEventListener("mousedown", (event) => { event.preventDefault(); choose(offer); });
            return item;
          })
        : [el("li", { className: "empty" }, "Nothing found")]));
      list.hidden = false;
    } catch (error) {
      if (mine !== ticket) return;
      list.replaceChildren(el("li", { className: "empty" }, error.message));
      list.hidden = false;
    }
  }

  input.addEventListener("input", () => {
    chosen = null;
    clearTimeout(timer);
    timer = setTimeout(search, SEARCH_DELAY_MS);
  });
  input.addEventListener("blur", close);

  return {
    /* The chosen offer, or an offer typed as a bare number. */
    value() {
      if (chosen) return chosen.id;
      const typed = input.value.trim();
      return /^\d+$/.test(typed) ? Number(typed) : null;
    },
    reset() { chosen = null; input.value = ""; close(); },
  };
}

/* ---- Tabs ---- */
function selectTab(name) {
  for (const key of ["create", "edit"]) {
    $(`tab-${key}`).setAttribute("aria-selected", String(key === name));
    $(`view-${key}`).hidden = key !== name;
  }
  if (name === "edit") loadCampaigns();
}
$("tab-create").addEventListener("click", () => selectTab("create"));
$("tab-edit").addEventListener("click", () => selectTab("edit"));

/* ---- Create ---- */
const createPicked = createPicker($("c-picker"), "c-offer");

$("create-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = $("c-msg");
  const offerId = createPicked.value();
  if (offerId === null) { showMessage(message, "err", "Pick an offer from the list or type its numeric ID."); return; }
  const button = $("c-submit");
  button.disabled = true;
  message.replaceChildren(el("div", { className: "msg spinner" }, "Creating…"));
  try {
    const created = await request(API.campaigns, {
      method: "POST",
      body: JSON.stringify({ name: $("c-name").value, geo: $("c-geo").value, offer_id: offerId }),
    });
    showMessage(message, "ok", `Created: ${created.name} (Keitaro ID ${created.keitaro_id ?? "—"}, status ${created.status}).`);
    $("c-name").value = ""; $("c-geo").value = ""; createPicked.reset();
  } catch (error) {
    showMessage(message, "err", error.message);
  } finally {
    button.disabled = false;
  }
});

/* ---- Edit ---- */
const editPicked = { current: null };

async function loadCampaigns(selectedId) {
  const select = $("e-campaign");
  try {
    const campaigns = (await request(API.campaigns)).filter((item) => item.status === "active");
    select.replaceChildren(...campaigns.map((item) =>
      el("option", { value: item.id, selected: String(item.id) === String(selectedId) }, `${item.name} — ${item.geo.join(", ")}`)));
    if (!campaigns.length) {
      $("e-body").replaceChildren(el("div", { className: "meta" }, "No active campaigns yet. Create one first."));
      return;
    }
    await loadOffers();
  } catch (error) {
    showMessage($("e-body"), "err", error.message);
  }
}
$("e-campaign").addEventListener("change", loadOffers);

async function loadOffers(note) {
  const id = $("e-campaign").value;
  if (!id) return;
  try {
    render(id, await request(API.campaignOffers(id)), note);
  } catch (error) {
    showMessage($("e-body"), "err", error.message);
  }
}

function render(id, data, note) {
  const total = data.offers.reduce((sum, offer) => sum + offer.share, 0);
  const only = data.offers.length === 1;
  const rows = data.offers.map((offer) => {
    const remove = el("button", { className: "btn small danger", type: "button", title: only ? "A campaign must keep at least one offer" : "", disabled: only }, "Remove");
    remove.addEventListener("click", () => change(() => request(API.campaignOffer(id, offer.offer_id), { method: "DELETE" }), `Removed offer ${offer.offer_id}.`));
    return el("tr", {},
      el("td", {}, String(offer.offer_id)), el("td", {}, offer.name),
      el("td", { className: "num" }, `${offer.share}%`), el("td", { className: "num" }, remove));
  });

  const picker = el("div", { className: "picker" });
  editPicked.current = createPicker(picker, "e-offer");
  const addButton = el("button", { className: "btn", type: "button" }, "Add offer");
  addButton.addEventListener("click", () => {
    const offerId = editPicked.current.value();
    if (offerId === null) { showMessage($("e-msg"), "err", "Pick an offer from the list or type its numeric ID."); return; }
    change(() => request(API.campaignOffers(id), { method: "POST", body: JSON.stringify({ offer_id: offerId }) }), `Added offer ${offerId}.`);
  });

  $("e-body").replaceChildren(
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Offer ID"), el("th", {}, "Name"), el("th", { className: "num" }, "Share"), el("th", {}))),
      el("tbody", {}, ...rows),
      el("tfoot", {}, el("tr", {}, el("td", {}, "Total"), el("td", {}), el("td", { className: "num" }, `${total}%`), el("td", {})))),
    el("label", { htmlFor: "e-offer" }, "Add an offer (search by name or ID)"),
    el("div", { className: "row" }, picker, addButton),
    el("div", { className: "hint" }, "Traffic is split evenly between the offers."),
    el("div", { id: "e-msg", role: "status" }));
  if (note) showMessage($("e-msg"), "ok", note);
}

async function change(action, note) {
  const buttons = $("e-body").querySelectorAll("button");
  buttons.forEach((button) => { button.disabled = true; });
  try {
    await action();
    await loadOffers(note);
  } catch (error) {
    buttons.forEach((button) => { button.disabled = false; });
    showMessage($("e-msg"), "err", error.message);
  }
}
</script>
</body>
</html>
